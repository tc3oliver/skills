name: Skills validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test BetFirst analyzer, docs and Plugin release validation
        run: python3 -m unittest discover -s betfirst/tests
      - name: Validate BetFirst controlled experiment runner
        run: |
          python3 -m unittest discover -s betfirst/experiments/tests
          python3 betfirst/experiments/run.py --driver mock --timeout 15 --output "$RUNNER_TEMP/betfirst-harness-smoke"
      - name: Validate portable Skills and Claude plugin manifest
        run: python3 backlog-workflow/scripts/validate_package.py
