<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">BetFirst v0.4 — Bet small. Win big. Lose small.</title>
<desc id="desc">Animated explanation of optional bounded bets, NORMAL and ABSTAIN, then measured results from 126 local agent executions. The evidence is descriptive, not a universal speedup claim.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#16263a"/></linearGradient><linearGradient id="amber" x2="1"><stop stop-color="#ffb451"/><stop offset="1" stop-color="#ffe6aa"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs>
<style>
text{font-family:Inter,Arial,sans-serif} .muted{fill:#a7bdd2}.white{fill:#f3f8ff}.gold{fill:#ffc978}.mint{fill:#6eedd0}
.scene{opacity:0;animation:cycle 12s linear infinite}
#hook{animation-delay:0s}#route{animation-delay:-9s}#decision{animation-delay:-6s}#evidence{animation-delay:-3s}
@keyframes cycle{0%,2%{opacity:0}5%,22%{opacity:1}25%,100%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}
.scan{animation:travel 2s linear infinite}@keyframes travel{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
</style>
<rect width="960" height="540" rx="20" fill="url(#bg)"/><path d="M0 82H960M0 457H960" stroke="#38516b" stroke-opacity=".65"/>
<text x="44" y="52" class="gold" font-size="22" font-weight="800">BETFIRST</text><text x="185" y="52" class="muted" font-size="15" letter-spacing="2">v0.4  ·  SELECTIVE EXECUTION</text>
<g id="hook" class="scene">
 <text x="52" y="165" class="white" font-size="45" font-weight="850">Why spend big</text><text x="52" y="224" class="gold" font-size="51" font-weight="850">before you bet small?</text>
 <g fill="#24384f" stroke="#49617b"><rect x="54" y="290" width="178" height="80" rx="14"/><rect x="258" y="290" width="178" height="80" rx="14"/><rect x="462" y="290" width="178" height="80" rx="14"/></g>
 <g class="muted" font-size="23" font-weight="700"><text x="106" y="339">DOCS</text><text x="305" y="339">RESEARCH</text><text x="518" y="339">PoC</text></g>
 <path class="scan" d="M237 331H255M441 331H459" stroke="#ffc978" stroke-width="5" stroke-dasharray="9 9"/><text x="55" y="412" class="mint" font-size="21">One small, safe probe may avoid unnecessary work.</text>
</g>
<g id="route" class="scene">
 <text x="53" y="136" class="white" font-size="35" font-weight="800">Not every task deserves a bet.</text>
 <rect x="52" y="178" width="274" height="182" rx="17" fill="#1f344a" stroke="#6592b3" stroke-width="2"/><rect x="344" y="178" width="274" height="182" rx="17" fill="#3a3022" stroke="#ffc978" stroke-width="2"/><rect x="636" y="178" width="274" height="182" rx="17" fill="#183e36" stroke="#6eedd0" stroke-width="2"/>
 <text x="77" y="230" class="white" font-size="31" font-weight="800">NORMAL</text><text x="77" y="269" class="muted" font-size="19">Default. Just fix it.</text><text x="77" y="305" class="muted" font-size="19">Verify normally.</text>
 <text x="370" y="230" class="gold" font-size="31" font-weight="800">BET</text><text x="370" y="269" class="white" font-size="19">Only if upside</text><text x="370" y="305" class="white" font-size="19">outweighs the cost.</text>
 <text x="660" y="230" class="mint" font-size="29" font-weight="800">ABSTAIN</text><text x="660" y="269" class="white" font-size="19">Already correct?</text><text x="660" y="305" class="white" font-size="19">Zero edits.</text>
</g>
<g id="decision" class="scene">
 <text x="53" y="138" class="white" font-size="37" font-weight="800">Bet on assumptions.</text><text x="53" y="188" class="gold" font-size="37" font-weight="800">Never gamble with correctness.</text>
 <rect x="54" y="233" width="250" height="114" rx="16" fill="#493525" stroke="#ffc978" stroke-width="2"/>
 <text x="80" y="279" class="gold" font-size="28" font-weight="800">TINY PROBE</text><text x="80" y="313" class="white" font-size="18">Bounded + reversible</text>
 <path class="scan" d="M306 290H381" stroke="#ffc978" stroke-width="5" stroke-dasharray="12 8"/>
 <rect x="382" y="223" width="232" height="62" rx="14" fill="#164b3e" stroke="#6eedd0"/><text x="405" y="264" class="mint" font-size="24" font-weight="800">WIN BIG</text>
 <rect x="382" y="298" width="232" height="62" rx="14" fill="#513626" stroke="#ffb97c"/><text x="405" y="339" class="gold" font-size="24" font-weight="800">LOSE SMALL</text>
 <text x="654" y="267" class="white" font-size="20">Skip wasted work</text><text x="654" y="339" class="white" font-size="20">Cut loss, go NORMAL</text>
 <text x="55" y="411" class="mint" font-size="22" font-weight="700">Always perform final verification.</text>
</g>
<g id="evidence" class="scene">
 <text x="53" y="129" class="white" font-size="37" font-weight="800">A bet backed by evidence.</text>
 <text x="54" y="197" class="gold" font-size="56" font-weight="850">126</text><text x="208" y="197" class="white" font-size="24">local agent executions</text><text x="54" y="236" class="muted" font-size="17">Two controlled studies · synthetic coding tasks</text>
 <rect x="52" y="273" width="413" height="105" rx="16" fill="#20394a" stroke="#68d9c2"/><rect x="484" y="273" width="424" height="105" rx="16" fill="#20394a" stroke="#68d9c2"/>
 <text x="73" y="331" class="mint" font-size="52" font-weight="850">−17.9%</text><text x="270" y="321" class="white" font-size="18">vs Efficiency</text><text x="270" y="346" class="muted" font-size="14">paired wall time</text>
 <text x="505" y="331" class="mint" font-size="52" font-weight="850">−18.0%</text><text x="715" y="321" class="white" font-size="18">vs No-BET</text><text x="715" y="346" class="muted" font-size="14">paired wall time</text>
 <text x="54" y="410" class="muted" font-size="16">Both-PASS pairs only · local Muse experiment · not a universal claim</text>
</g>
<text x="54" y="499" class="white" font-size="23" font-weight="800">MAKE CHEAP BETS.</text><text x="316" y="499" class="mint" font-size="23" font-weight="800">WIN BIG.</text><text x="464" y="499" class="gold" font-size="23" font-weight="800">LOSE SMALL.</text>
<text x="752" y="499" class="muted" font-size="16">github.com/tc3oliver/skills</text>
</svg>