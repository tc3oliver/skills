<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">BetFirst — Make Cheap Bets. Win Big. Lose Small.</title>
<desc id="desc">When a bounded and reversible feasibility probe could avoid major research, make a small bet; otherwise work normally. A decisive win avoids work made unnecessary by evidence; a loss stops safely and returns to ordinary investigation. Final verification remains mandatory.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1322"/><stop offset="1" stop-color="#15283c"/></linearGradient>
<linearGradient id="gold" x2="1"><stop stop-color="#ffb74f"/><stop offset="1" stop-color="#ffe2a4"/></linearGradient>
<linearGradient id="mint" x2="1"><stop stop-color="#2ecbaa"/><stop offset="1" stop-color="#8cf4d7"/></linearGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#a5bed9" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1200" height="480" rx="22" fill="url(#bg)"/><rect width="1200" height="480" rx="22" fill="url(#grid)"/>
<rect width="1200" height="5" rx="2" fill="url(#gold)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif">
 <text x="65" y="70" font-size="17" fill="#aabdd5" font-weight="700" letter-spacing="2.8">BETFIRST  /  A DECISION SKILL FOR CODING AGENTS</text>
 <text x="61" y="194" font-size="104" letter-spacing="-6" font-weight="850" fill="#f5f8ff">Bet</text>
 <text x="230" y="194" font-size="104" letter-spacing="-6" font-weight="850" fill="url(#gold)">First</text>
 <text x="67" y="252" font-size="34" font-weight="760" fill="#f4f8ff">Make Cheap Bets.</text>
 <text x="67" y="297" font-size="34" font-weight="760" fill="#67ebc9">Win Big. Lose Small.</text>
 <text x="67" y="351" font-size="18" fill="#b7c7da">BET only when the expected saving outweighs the cost.</text>
 <text x="67" y="378" font-size="18" fill="#b7c7da">NORMAL by default. Always verify the final fix.</text>
 <rect x="67" y="409" width="149" height="35" rx="17" fill="#26364d"/><text x="86" y="432" font-size="13" font-weight="750" fill="#f0f6ff">CLAUDE CODE</text>
 <rect x="229" y="409" width="55" height="35" rx="17" fill="#26364d"/><text x="247" y="432" font-size="13" font-weight="750" fill="#f0f6ff">PI</text>
 <rect x="297" y="409" width="93" height="35" rx="17" fill="#403326"/><text x="316" y="432" font-size="13" font-weight="750" fill="#ffe0a2">v0.4</text>
</g>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif">
 <rect x="635" y="66" width="506" height="75" rx="15" fill="#1d2b42" stroke="#4e6880"/>
 <text x="661" y="91" font-size="13" font-weight="770" fill="#96abc5" letter-spacing="1.6">WHEN INVESTIGATION IS EXPENSIVE</text>
 <text x="661" y="119" font-size="22" font-weight="700" fill="#e4eaf3">Docs  →  Research  →  PoC  →  Try</text>
 <rect x="635" y="165" width="210" height="88" rx="17" fill="#402f24" stroke="#ffbd63" stroke-width="2"/>
 <text x="664" y="200" font-size="15" fill="#ffcf89" font-weight="770" letter-spacing="1.4">BET (OPTIONAL)</text>
 <text x="664" y="229" font-size="23" fill="#fff1d5" font-weight="760">Small safe wager</text>
 <path d="M845 208H895" stroke="#e4b472" stroke-width="3" fill="none"/>
 <path d="M886 201l12 7-12 7" stroke="#e4b472" stroke-width="3" fill="none" stroke-linejoin="round"/>
 <rect x="913" y="157" width="228" height="78" rx="14" fill="#163a35" stroke="#48d9b4"/>
 <text x="931" y="185" font-size="16" font-weight="790" fill="#73ebca">WIN</text>
 <text x="931" y="210" font-size="17" fill="#e3faf3">Avoid wasted work</text>
 <rect x="913" y="251" width="228" height="78" rx="14" fill="#3b3130" stroke="#e9a97a"/>
 <text x="931" y="279" font-size="16" font-weight="790" fill="#ffc491">LOSE / FOLD</text>
 <text x="931" y="304" font-size="17" fill="#f7e7dc">Stop. Investigate.</text>
 <path d="M886 208H899V290H913" stroke="#bf9076" stroke-width="2" fill="none"/>
 <path d="M1027 330V361" stroke="#6ccbb5" stroke-width="2.5" stroke-dasharray="5 7"/>
 <rect x="831" y="361" width="310" height="52" rx="14" fill="#243750" stroke="#627d96"/>
 <text x="851" y="393" font-size="18" font-weight="750" fill="#edf7ff">Always verify final work</text>
</g>
</svg>