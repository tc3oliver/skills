  <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#f5a94c"/><stop offset="1" stop-color="#ffe0a1"/></linearGradient>
  <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#35cfa9"/><stop offset="1" stop-color="#7cf0d6"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#96aac6" stroke-opacity=".065"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
