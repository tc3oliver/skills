<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">BetFirst — Make Cheap Bets. Win Big. Lose Small.</title>
  <desc id="desc">A dark editorial hero for the BetFirst coding-agent skill. A tiny reversible probe branches into a large win or a bounded loss.</desc>
