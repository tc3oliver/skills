    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#32E5B4"/><stop offset="1" stop-color="#65F0D5"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#86A7D7" stroke-opacity=".07" stroke-width="1"/></pattern>
