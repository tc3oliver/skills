<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="472" viewBox="0 0 1200 472" role="img" aria-labelledby="title desc">
<title id="title">BetFirst — Make cheap bets. Win big. Lose small.</title>
<desc id="desc">Product hero featuring a short glowing evidence path crossing a complex maze. A cheap reversible bet can eliminate unnecessary investigation; failed bets have bounded losses and final verification remains required.</desc>
