# Managed by backlog-workflow 1.5.0
workflow_version: 1.5.0
default_mode: manual

# Which Backlog.md status plays each workflow role. Every value must be one of
# the statuses configured in the Backlog.md project config
# (`backlog config get statuses`). Detected at install and preserved across
# upgrades, so a project with custom status names keeps them.
# `blocked` must differ from `not_started`: /backlog-auto selects on
# `not_started`, which is what keeps a blocked task out of the next round.
statuses:
  not_started: To Do
  active: In Progress
  blocked: Blocked
  done: Done

manual:
  planning_skill: backlog-plan
  review_skill: backlog-review
  execution_skill: backlog-run
  require_explicit_task_id: true
  stop_after_task: true

automatic:
  execution_skill: backlog-auto
  require_explicit_invocation: true
  continue_until_exhausted: true
  # Number of independent, dependency-ready tasks /backlog-auto may execute at
  # once, each isolated in its own git worktree. 1 = sequential (default,
  # unchanged behavior). Raise to opt into parallel execution.
  max_parallel_tasks: 1
