# Managed by backlog-workflow 1.2.0
workflow_version: 1.2.0
default_mode: manual

manual:
  planning_skill: backlog-plan
  execution_skill: backlog-run
  require_explicit_task_id: true
  stop_after_task: true

automatic:
  execution_skill: backlog-auto
  require_explicit_invocation: true
  continue_until_exhausted: true
  # Number of independent, dependency-ready tasks /backlog-auto may execute at
  # once, each isolated in its own git worktree. 1 = sequential (default,
  # unchanged behavior). Raise to opt into parallel execution.
  max_parallel_tasks: 1
